<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Random Quote Machine — A simple, beautiful app that generates inspiring quotes. Built by Carlos S. Nah, Jr."
        />
        <meta name="author" content="Carlos S. Nah, Jr" />
        <meta name="theme-color" content="#0b1120" />
        <title>Random Quote Machine — Carlos S. Nah</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <!-- Icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />

        <!-- Styles -->
        <link rel="stylesheet" href="css/styles.css" />
    </head>

    <body>
        <!-- Back link -->
        <a
            href="../index.html"
            class="back-link"
            aria-label="Back to portfolio"
        >
            <i class="fa-solid fa-arrow-left"></i>
            <span>Portfolio</span>
        </a>

        <!-- Clock widget -->
        <div class="clock" aria-live="polite">
            <span class="clock__date" id="clock-date"></span>
            <span class="clock__separator">·</span>
            <span class="clock__time" id="clock-time"></span>
        </div>

        <main class="app">
            <div class="app__header">
                <h1>Random Quote Machine</h1>
                <p class="app__subtitle">
                    Tap the button. Get inspired. Share the wisdom.
                </p>
            </div>

            <!-- Quote card -->
            <div class="quote-card" id="quote-card">
                <div class="quote-card__inner">
                    <i
                        class="fa-solid fa-quote-left quote-card__icon"
                        aria-hidden="true"
                    ></i>
                    <blockquote class="quote-card__text" id="quote-text">
                        Loading your first quote...
                    </blockquote>
                    <cite class="quote-card__author" id="quote-author"
                        >&nbsp;</cite
                    >
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button class="btn btn--primary" id="new-quote" type="button">
                    <i class="fa-solid fa-rotate"></i>
                    New Quote
                </button>
                <div class="actions__share">
                    <a
                        class="btn-icon"
                        id="share-twitter"
                        href="#"
                        target="_blank"
                        rel="noopener"
                        aria-label="Share on X (Twitter)"
                    >
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>
                    <button
                        class="btn-icon"
                        id="copy-quote"
                        type="button"
                        aria-label="Copy quote to clipboard"
                    >
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <footer class="app__footer">
                <p>
                    Built by <a href="../index.html">Carlos S. Nah, Jr</a> ·
                    Powered by open-source quotes
                </p>
            </footer>
        </main>

        <script src="js/style.js"></script>
    </body>
</html>
